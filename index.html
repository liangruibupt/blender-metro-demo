<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#edf0ef" />
    <meta name="description" content="Metro Atelier M01: an original metro concept with an explorable passenger saloon and driver cab, created in Blender." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>M01 · Metro Atelier</title>
  </head>
  <body>
    <main id="app">
      <div id="viewport" aria-label="地铁三维交互视图"></div>
      <header class="header">
        <a class="brand" href="./" aria-label="Metro Atelier 首页"><span class="brand-mark">M<span></span></span><span>METRO<span class="brand-light">ATELIER</span></span></a>
        <div class="project-tag"><span class="live-dot"></span> CONCEPT SERIES <span class="divider">/</span> 001</div>
        <div class="header-actions">
          <button class="icon-button" id="capture" title="保存当前视角" aria-label="保存当前视角" disabled><i data-lucide="camera"></i></button>
          <button class="icon-button" id="fullscreen" title="全屏" aria-label="全屏"><i data-lucide="maximize"></i></button>
          <a class="icon-button" href="./assets/metro.glb" download title="下载 3D 模型" aria-label="下载 3D 模型"><i data-lucide="download"></i></a>
        </div>
      </header>
      <section class="identity" aria-label="列车信息">
        <div class="eyebrow">URBAN RAIL <span>/</span> HARBOR LINE</div>
        <h1>M01<span class="title-dot">.</span></h1>
        <p>城市轨道概念列车</p>
        <div class="spec-strip"><span><b>19.4</b> m<span>车长</span></span><span><b>24</b> 席<span>含折叠座椅</span></span><span><b>06</b> 组<span>侧门</span></span></div>
      </section>
      <aside class="scene-tools" aria-label="展示选项">
        <button id="orbit" class="tool-button active" aria-label="自动环绕" aria-pressed="true" title="自动环绕"><i data-lucide="rotate-3d"></i><span>自动环绕</span></button>
        <button id="doors" class="tool-button" aria-label="车门" aria-pressed="false" title="打开车门"><i data-lucide="door-open"></i><span>车门</span></button>
        <button id="cutaway" class="tool-button" aria-label="剖视" aria-pressed="false" title="移除车顶"><i data-lucide="layers-2"></i><span>剖视</span></button>
        <div class="tool-divider"></div>
        <button id="reset" class="tool-button" aria-label="复位" title="重置当前视角"><i data-lucide="focus"></i><span>复位</span></button>
      </aside>
      <div id="hotspots" aria-label="细节位置"></div>
      <aside id="detail-panel" class="detail-panel" hidden>
        <div class="detail-heading"><span id="detail-index"></span><button id="close-detail" class="icon-button" aria-label="关闭细节"><i data-lucide="x"></i></button></div>
        <h2 id="detail-title"></h2><p id="detail-copy"></p>
        <dl id="detail-specs"></dl>
      </aside>
      <div class="loading" id="loading" role="status"><div class="loading-line"><span></span></div><span id="loading-label">正在载入 M01</span></div>
      <div class="error-state" id="error" role="alert" hidden><h2>模型暂时无法载入</h2><p id="error-copy"></p><button id="retry">重新载入</button></div>
      <footer class="footer">
        <div class="view-caption"><span id="view-number">01 / 03</span><strong id="view-name">外观全景</strong><span id="view-en">EXTERIOR</span></div>
        <nav class="view-selector" aria-label="视角切换">
          <button class="view-tab selected" data-view="exterior" aria-label="外观 360°" aria-pressed="true"><i data-lucide="train-front"></i><span>外观 <small>360°</small></span></button>
          <button class="view-tab" data-view="interior" aria-pressed="false"><i data-lucide="armchair"></i><span>进入车厢</span></button>
          <button class="view-tab" data-view="cab" aria-pressed="false"><i data-lucide="gauge"></i><span>进入驾驶室</span></button>
        </nav>
        <div class="footer-meta"><span class="swatch"></span> JADE / ALUMINIUM<span class="concept">ORIGINAL CONCEPT · BLENDER</span></div>
      </footer>
      <div class="walk-controls" id="walk-controls" hidden aria-label="舱内移动">
        <button class="icon-button walk-up" data-walk="forward" aria-label="前进" title="前进"><i data-lucide="arrow-up"></i></button>
        <button class="icon-button walk-left" data-walk="left" aria-label="左移" title="左移"><i data-lucide="arrow-left"></i></button>
        <button class="icon-button walk-down" data-walk="back" aria-label="后退" title="后退"><i data-lucide="arrow-down"></i></button>
        <button class="icon-button walk-right" data-walk="right" aria-label="右移" title="右移"><i data-lucide="arrow-right"></i></button>
      </div>
      <div id="toast" role="status"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
