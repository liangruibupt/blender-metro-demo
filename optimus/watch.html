<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="../favicon.svg">
  <title>Optimus Prime · 80 秒展示影片</title>
  <style>
    :root{font-family:system-ui,"PingFang SC",sans-serif;letter-spacing:0;background:#e8eaec;color:#272d35}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;grid-template-rows:auto 1fr}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px;border-bottom:1px solid #cbd0d7;background:#fafafb;flex-wrap:wrap}
    h1{font-size:16px;font-weight:600;margin:0}
    nav{display:flex;gap:20px}
    a{font-size:12px;color:#525d6d;text-decoration:none}
    a:hover{text-decoration:underline}
    a:focus-visible{outline:2px solid #bc2b38;outline-offset:4px}
    main{min-width:0;display:flex;align-items:center;justify-content:center}
    video{display:block;width:100%;max-height:calc(100svh - 90px);aspect-ratio:16/9;background:#e8eaec}
    @media(max-width:600px){header{padding:14px 16px}h1{font-size:14px}nav{gap:14px}}
  </style>
</head>
<body>
  <header><h1>OPTIMUS PRIME / METAL V2</h1><nav aria-label="展示入口"><a href="./index.html">交互展示</a><a href="../metro/index.html">地铁展示</a></nav></header>
  <main><video controls playsinline preload="metadata" poster="./deliverables/optimus-robot.png" src="./deliverables/optimus-showcase.mp4" aria-label="擎天柱 80 秒展示影片"></video></main>
</body>
</html>
